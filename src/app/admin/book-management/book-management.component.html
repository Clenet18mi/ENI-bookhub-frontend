<table mat-table [dataSource]="books" class="mat-elevation-z2">
  <ng-container matColumnDef="title"><th mat-header-cell *matHeaderCellDef>Titre</th><td mat-cell *matCellDef="let b">{{b.title}}</td></ng-container>
  <ng-container matColumnDef="author"><th mat-header-cell *matHeaderCellDef>Auteur</th><td mat-cell *matCellDef="let b">{{b.author}}</td></ng-container>
  <ng-container matColumnDef="totalCopies"><th mat-header-cell *matHeaderCellDef>Stock</th><td mat-cell *matCellDef="let b">{{b.totalCopies}}</td></ng-container>
  <ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef></th><td mat-cell *matCellDef="let b"><button mat-icon-button color="warn" (click)="deleteBook(b.id!)"><mat-icon>delete</mat-icon></button></td></ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
