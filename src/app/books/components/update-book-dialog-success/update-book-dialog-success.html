<div class="success-container update-mode">
    <div class="icon-header">
        <mat-icon>published_with_changes</mat-icon>
    </div>

    <h2 mat-dialog-title>Livre modifié avec succès !</h2>

    <mat-dialog-content>
        <div class="book-preview">
            <div class="book-details">
                <p class="label">Titre</p>
                <p class="value">{{ data.title }}</p>

                <p class="info-text">
                    Les informations du livre ont été mises à jour dans le catalogue.
                </p>
            </div>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="center">
        <button mat-flat-button class="success-btn" mat-dialog-close>Parfait !</button>
    </mat-dialog-actions>
</div>
