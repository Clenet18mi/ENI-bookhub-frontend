<div class="success-container">
    <mat-icon class="success-icon">check_circle</mat-icon>
    <h2 mat-dialog-title>Livre supprimé</h2>

    <mat-dialog-content>
        <p>Le livre <strong>"{{ data.title }}"</strong> a été retiré du catalogue avec succès.</p>
    </mat-dialog-content>

    <mat-dialog-actions align="center">
        <button mat-flat-button color="primary" mat-dialog-close>Continuer</button>
    </mat-dialog-actions>
</div>
